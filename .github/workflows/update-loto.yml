name: update-loto

on:
  # input/*.csv 를 GitHub 웹에서 고쳐 저장(commit)하면 자동 실행
  push:
    branches: [main]
    paths: ['input/**', 'scripts/**', '.github/workflows/**']
  # Actions 탭에서 손으로 실행
  workflow_dispatch:
  # 입력 깜빡 알림: 화·금·토 12:00 (일본 시간) 에 빠진 회차가 있으면 실패 → GitHub 가 메일로 알려 준다
  schedule:
    - cron: '0 3 * * 2,5,6'

permissions:
  contents: write

concurrency:
  group: update-loto
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 번호 개수·범위·중복·회차 순서 검사. 틀리면 여기서 멈추고 data/*.json 은 그대로 둔다
      - name: Validate and build JSON
        run: node scripts/build.js

      - name: Commit only if data changed
        id: commit
        run: |
          if git diff --quiet -- data && [ -z "$(git status --porcelain -- data)" ]; then
            echo "no change"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update winning numbers"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr 는 @main 파일을 최대 12시간 캐시한다 → 바뀌었을 때만 바로 비워 준다
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in loto6 loto7; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/$f.json" || true
            echo
          done

      - name: Check for missing rounds
        if: github.event_name == 'schedule'
        run: node scripts/build.js --check-stale
